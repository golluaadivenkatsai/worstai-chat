<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WorstAI</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #212121;
      --bg-alt: #2f2f2f;
      --text: #ececec;
      --text-muted: #b4b4b4;
      --border: #424242;
      --accent: #10a37f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; height: 100vh; height: 100dvh; overflow: hidden; }
    
    /* SIDEBAR */
    #sidebar {
      width: 260px;
      background: var(--bg-alt);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: width 0.3s, transform 0.3s;
    }
    #sidebar.closed {
      width: 0;
      transform: translateX(-260px);
      border-right: none;
    }
    .sidebar-header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .new-chat-btn {
      flex: 1;
      display: flex; align-items: center; gap: 8px;
      padding: 10px; background: transparent; color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      cursor: pointer; font-weight: 500; font-size: 0.9rem;
      transition: background 0.2s;
    }
    .new-chat-btn:hover { background: var(--border); }
    
    .sidebar-section {
      padding: 16px; border-top: 1px solid var(--border);
    }
    .sidebar-section h3 { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; }
    
    .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.85rem; }
    .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border); transition: .2s; border-radius: 20px; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .2s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(14px); }

    /* MAIN APP */
    #main-app {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    header {
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      font-weight: 600;
    }
    
    /* Remove old dropdown */
    
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .message {
      width: 100%;
      max-width: 800px;
      padding: 24px;
      display: flex;
      gap: 20px;
      line-height: 1.6;
    }
    .message.user {
      background-color: transparent;
    }
    .message.ai {
      background-color: var(--bg-alt);
      border-radius: 12px;
    }
    
    .avatar {
      width: 36px; height: 36px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; flex-shrink: 0;
    }
    .avatar.user-avatar { background-color: #5436da; color: white; }
    .avatar.ai-avatar { background-color: var(--accent); color: white; }
    
    .agent-badges {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px;
    }
    .badge {
      font-size: 0.7rem; font-weight: 600; padding: 4px 8px; border-radius: 4px;
      background: rgba(16, 163, 127, 0.2); color: var(--accent); white-space: nowrap;
    }
    
    .content {
      flex: 1;
      white-space: normal;
      font-size: 1rem;
    }
    
    /* Markdown Beauty Styles */
    .content h1, .content h2, .content h3 { color: var(--text); font-weight: 600; margin-top: 1.2em; margin-bottom: 0.5em; line-height: 1.3; }
    .content h1 { font-size: 1.6rem; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .content h2 { font-size: 1.4rem; }
    .content h3 { font-size: 1.2rem; }
    .content p { margin-bottom: 1em; line-height: 1.7; color: #d1d5db; }
    .content strong { color: #f3f4f6; font-weight: 600; }
    .content ul, .content ol { margin-bottom: 1.2em; padding-left: 2em; color: #d1d5db; }
    .content li { margin-bottom: 0.4em; }
    .content table { width: 100%; border-collapse: collapse; margin-bottom: 1.5em; border-radius: 8px; overflow: hidden; font-size: 0.95em; }
    .content th, .content td { border: 1px solid var(--border); padding: 12px 16px; text-align: left; }
    .content th { background-color: rgba(255, 255, 255, 0.05); font-weight: 600; color: #f3f4f6; }
    .content td { background-color: rgba(0, 0, 0, 0.2); }
    .content blockquote { border-left: 4px solid var(--accent); padding-left: 16px; margin: 1.2em 0; color: var(--text-muted); font-style: italic; background: rgba(16, 163, 127, 0.05); padding: 12px 16px; border-radius: 0 8px 8px 0; }
    .content code { background-color: rgba(0, 0, 0, 0.4); padding: 3px 6px; border-radius: 4px; font-family: monospace; font-size: 0.9em; color: #fca5a5; }
    .content pre { background-color: #1e1e2e; padding: 16px; border-radius: 8px; overflow-x: auto; margin-bottom: 1.5em; border: 1px solid var(--border); }
    .content pre code { background-color: transparent; padding: 0; color: #e5e7eb; font-size: 0.85em; }
    .content a { color: #60a5fa; text-decoration: none; }
    .content a:hover { text-decoration: underline; }
    
    #input-area {
      padding: 24px;
      display: flex;
      justify-content: center;
      background: linear-gradient(180deg, transparent, var(--bg) 20%);
    }
    
    form {
      width: 100%;
      max-width: 800px;
      position: relative;
    }
    
    textarea {
      width: 100%;
      padding: 16px 50px 16px 20px;
      border-radius: 24px;
      border: 1px solid var(--border);
      background-color: var(--bg-alt);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      resize: none;
      overflow-y: auto;
      max-height: 200px;
      display: block;
      line-height: 1.5;
    }
    textarea:focus {
      border-color: #565656;
    }
    
    #submit-btn {
      position: absolute;
      right: 12px;
      bottom: 12px;
      background: var(--text);
      color: var(--bg);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    #submit-btn:disabled { background: var(--border); cursor: not-allowed; }
    #submit-btn:hover:not(:disabled) { background: #fff; }
    
    .loading {
      display: inline-block;
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .welcome-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; flex: 1; color: var(--text);
    }
    .welcome-screen h1 { font-size: 2rem; margin-bottom: 8px; font-weight: 600; }
    
    /* MODAL */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6); display: none;
      align-items: center; justify-content: center; z-index: 100;
    }
    .modal {
      background: var(--bg-alt); padding: 24px; border-radius: 12px;
      width: 90%; max-width: 400px; border: 1px solid var(--border);
    }
    .modal h2 { margin-bottom: 16px; font-size: 1.2rem; }
    .modal p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 16px; line-height: 1.4; }
    .modal input { width: 100%; margin-bottom: 16px; border-radius: 8px; padding: 12px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 12px; }
    .btn { padding: 8px 16px; border-radius: 6px; cursor: pointer; border: none; font-weight: 500; }
    .btn-cancel { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-save { background: var(--accent); color: white; }

    /* AUTH SCREEN */
    #auth-screen {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg); display: flex; align-items: center; justify-content: center;
      z-index: 999; flex-direction: column;
    }
    .auth-box {
      background: var(--bg-alt); padding: 32px; border-radius: 12px;
      width: 100%; max-width: 360px; border: 1px solid var(--border);
      text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .auth-box h1 { margin-bottom: 24px; font-size: 1.5rem; font-weight: 600; }
    .auth-box input { width: 100%; margin-bottom: 16px; border-radius: 8px; padding: 14px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none;}
    .auth-box input:focus { border-color: var(--accent); }
    .auth-box .auth-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: 500; font-size: 1rem; margin-bottom: 12px; }
    .auth-box .btn-signin { background: var(--accent); color: white; }
    .auth-box .btn-signup { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .auth-error { color: #ff5c5c; margin-bottom: 16px; font-size: 0.9rem; min-height: 20px; }

    #mobile-overlay {
      display: none;
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6); z-index: 999;
    }

    /* MOBILE RESPONSIVENESS */
    @media (max-width: 768px) {
      #sidebar {
        position: absolute;
        height: 100vh;
        height: 100dvh;
        z-index: 1000;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
      }
      #sidebar:not(.closed) ~ #mobile-overlay {
        display: block;
      }
      #main-app {
        width: 100vw;
      }
      header {
        padding: 12px;
        font-size: 0.95rem;
      }
      .message {
        padding: 16px 12px;
        gap: 12px;
      }
      .avatar {
        width: 32px; height: 32px; font-size: 0.85rem;
      }
      .content {
        font-size: 0.95rem;
      }
      #input-area {
        padding: 12px;
      }
      textarea {
        padding: 12px 48px 12px 16px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen">
    <div class="auth-box">
      <h1>WorstAI Login</h1>
      <div class="auth-error" id="auth-error"></div>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px;">Already have an account? Sign In.<br>Don't have an account? Create Account.</p>
      <input type="email" id="auth-email" placeholder="Email Address" autocomplete="new-password" />
      <input type="password" id="auth-password" placeholder="Password" autocomplete="new-password" />
      <button class="auth-btn btn-signin" onclick="signIn()">Sign In</button>
      <button class="auth-btn btn-signup" onclick="signUp()">Create Account</button>
    </div>
  </div>

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="sidebar-header" style="justify-content: space-between;">
      <button class="new-chat-btn" onclick="startNewChat()">➕ New Chat</button>
      <button onclick="toggleSidebar()" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:1.2rem; margin-left:12px;">✖</button>
    </div>
    
    <div class="sidebar-section" style="flex:1; overflow-y:auto; border-top:none; padding-top:0;">
      <h3 style="margin-top:16px;">Recent Chats</h3>
      <div id="sessions-list">
        <!-- Sessions will be loaded here -->
      </div>
    </div>
    
    <div class="sidebar-section">
      <h3>Multi-Agent Features</h3>
      
      <div class="setting-row">
        <span>Deep Research</span>
        <label class="switch"><input type="checkbox" id="feature-research" checked><span class="slider"></span></label>
      </div>
      

      <div class="setting-row">
        <span>Privacy Auditor</span>
        <label class="switch"><input type="checkbox" id="feature-privacy" checked><span class="slider"></span></label>
      </div>
      
      <div class="setting-row">
        <span>Security Auditor</span>
        <label class="switch"><input type="checkbox" id="feature-security" checked><span class="slider"></span></label>
      </div>

      <div class="setting-row">
        <span>Fact-Checking Agent</span>
        <label class="switch"><input type="checkbox" id="feature-factcheck" checked><span class="slider"></span></label>
      </div>

      <div class="setting-row">
        <span>Sentiment Analysis Agent</span>
        <label class="switch"><input type="checkbox" id="feature-sentiment" checked><span class="slider"></span></label>
      </div>
      <div class="setting-row" style="margin-top: 32px; justify-content: center;">
        <button class="btn btn-cancel" onclick="signOut()" style="width: 100%;">🚪 Sign Out</button>
      </div>
    </div>
  </div>
  <div id="mobile-overlay" onclick="toggleSidebar()"></div>

  <!-- MAIN APP -->
  <div id="main-app">
    <header style="justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 16px;">
        <button onclick="toggleSidebar()" style="position:static; background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:1.5rem; transform:none; width:auto; height:auto; padding:0 8px;">⋮</button>
        <div>WorstAI</div>
      </div>
    </header>
    
    <!-- API KEY MODAL REMOVED -->

  <div id="chat-container">
    <div class="welcome-screen" id="welcome">
      <h1>WorstAI</h1>
      <p style="color:var(--text-muted); margin-top:8px;">Multi-Agent Intelligence</p>
    </div>
  </div>

  <div id="input-area">
    <form onsubmit="event.preventDefault(); sendMessage();">
      <textarea id="prompt-input" placeholder="WorstAI" rows="1"></textarea>
      <button type="submit" id="submit-btn">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </form>
  </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyANT-Ne19ZN7avm-D_0QFSc1-liulKMGG8",
      authDomain: "worstai.firebaseapp.com",
      projectId: "worstai",
      storageBucket: "worstai.firebasestorage.app",
      messagingSenderId: "955810193416",
      appId: "1:955810193416:web:2db36a1d9a5c971189f1bd",
      measurementId: "G-J1DX049XWZ"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const authScreen = document.getElementById('auth-screen');
    const authError = document.getElementById('auth-error');
    const authEmail = document.getElementById('auth-email');
    const authPassword = document.getElementById('auth-password');

    firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);

    let inactivityTimer;
    function resetInactivityTimer() {
      clearTimeout(inactivityTimer);
      if (auth.currentUser) {
        // Sign out after 1 hour (3600000 ms) of inactivity
        inactivityTimer = setTimeout(() => {
          signOut();
          alert("You have been signed out due to 1 hour of inactivity.");
        }, 3600000);
      }
    }
    window.addEventListener('mousemove', resetInactivityTimer);
    window.addEventListener('keypress', resetInactivityTimer);
    window.addEventListener('click', resetInactivityTimer);

    auth.onAuthStateChanged(user => {
      if (user) {
        authScreen.style.display = 'none';
        resetInactivityTimer();
      } else {
        authScreen.style.display = 'flex';
        clearTimeout(inactivityTimer);
      }
    });

    function signIn() {
      authError.innerText = '';
      auth.signInWithEmailAndPassword(authEmail.value, authPassword.value)
        .catch(err => authError.innerText = err.message);
    }

    function signUp() {
      authError.innerText = '';
      auth.createUserWithEmailAndPassword(authEmail.value, authPassword.value)
        .catch(err => authError.innerText = err.message);
    }

    function signOut() {
      auth.signOut().then(() => {
        authEmail.value = '';
        authPassword.value = '';
        authError.innerText = '';
      });
    }

    const sidebar = document.getElementById('sidebar');
    const chatContainer = document.getElementById('chat-container');
    const welcomeScreen = document.getElementById('welcome');
    const inputField = document.getElementById('prompt-input');
    const submitBtn = document.getElementById('submit-btn');
    const sessionsList = document.getElementById('sessions-list');
    
    let currentSessionId = null;
    let localSessions = JSON.parse(localStorage.getItem('worstai_sessions') || '{}');

    function saveSessions() {
      localStorage.setItem('worstai_sessions', JSON.stringify(localSessions));
    }

    function generateId() {
      return Math.random().toString(36).substring(2, 15);
    }

    function toggleSidebar() {
      sidebar.classList.toggle('closed');
    }

    function startNewChat() {
      currentSessionId = generateId();
      chatContainer.innerHTML = '<div class="welcome-screen" id="welcome"><h1>WorstAI</h1><p style="color:var(--text-muted); margin-top:8px;">Multi-Agent Intelligence</p></div>';
      if (window.innerWidth < 768) {
        sidebar.classList.add('closed');
      }
    }

    function fetchSessions() {
      sessionsList.innerHTML = '';
      const sortedIds = Object.keys(localSessions).sort((a, b) => localSessions[b].updated_at - localSessions[a].updated_at);
      
      sortedIds.slice(0, 15).forEach(sid => {
        const session = localSessions[sid];
        const wrap = document.createElement('div');
        wrap.style.display = 'flex';
        wrap.style.alignItems = 'center';
        wrap.style.marginBottom = '8px';

        const btn = document.createElement('button');
        btn.className = 'new-chat-btn';
        btn.style.margin = '0';
        btn.style.background = 'transparent';
        btn.style.border = 'none';
        btn.style.textAlign = 'left';
        btn.style.flex = '1';
        btn.innerText = '💬 ' + session.title;
        btn.onclick = () => loadSession(sid);

        const delBtn = document.createElement('button');
        delBtn.innerHTML = '✖';
        delBtn.style.background = 'none';
        delBtn.style.border = 'none';
        delBtn.style.color = 'var(--text-muted)';
        delBtn.style.cursor = 'pointer';
        delBtn.style.padding = '8px';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          deleteSession(sid);
        };

        wrap.appendChild(btn);
        wrap.appendChild(delBtn);
        sessionsList.appendChild(wrap);
      });
    }

    function deleteSession(sessionId) {
      if (!confirm("Are you sure you want to delete this chat?")) return;
      delete localSessions[sessionId];
      saveSessions();
      if (currentSessionId === sessionId) {
        startNewChat();
      }
      fetchSessions();
    }

    function loadSession(sessionId) {
      currentSessionId = sessionId;
      if (window.innerWidth < 768) {
        sidebar.classList.add('closed');
      }
      chatContainer.innerHTML = ''; 
      
      if (localSessions[sessionId] && localSessions[sessionId].messages.length > 0) {
        localSessions[sessionId].messages.forEach(msg => {
          appendMessage(msg.role === 'user' ? 'user' : 'ai', msg.content, msg.agents || []);
        });
      } else {
        chatContainer.innerHTML = '<div class="welcome-screen" id="welcome"><h1>WorstAI</h1><p style="color:var(--text-muted); margin-top:8px;">Multi-Agent Intelligence</p></div>';
      }
    }

    function appendMessage(role, text, agents = []) {
      if (welcomeScreen) welcomeScreen.style.display = 'none';
      
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;
      
      const avatarStr = role === 'user' ? 'U' : 'AI';
      
      let agentHtml = '';
      if (role === 'ai' && agents.length > 0) {
        agentHtml = '<div class="agent-badges">' + agents.map(a => `<span class="badge">✓ ${a}</span>`).join('') + '</div>';
      }
      
      msgDiv.innerHTML = `
        <div class="avatar ${role}-avatar">${avatarStr}</div>
        <div style="flex:1;">
          ${agentHtml}
          <div class="content">${role === 'ai' ? marked.parse(text) : text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>
        </div>
      `;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msgDiv;
    }

    // Settings UI Removed

    async function sendMessage() {
      const prompt = inputField.value.trim();
      if (!prompt) return;

      if (!currentSessionId) {
        currentSessionId = generateId();
      }
      
      if (!localSessions[currentSessionId]) {
        localSessions[currentSessionId] = {
          title: prompt.substring(0, 30) + (prompt.length > 30 ? "..." : ""),
          messages: [],
          updated_at: Date.now()
        };
      }

      inputField.value = '';
      inputField.style.height = 'auto';
      submitBtn.disabled = true;

      appendMessage('user', prompt);
      
      const historyToSend = localSessions[currentSessionId].messages.map(m => ({role: m.role, content: m.content}));

      const aiMsgDiv = appendMessage('ai', '');
      aiMsgDiv.querySelector('.content').innerHTML = '<div class="loading"></div>';

      const isResearchOn = document.getElementById('feature-research').checked;
      const isPrivacyOn = document.getElementById('feature-privacy').checked;
      const isSecurityOn = document.getElementById('feature-security').checked;
      const isFactCheckOn = document.getElementById('feature-factcheck').checked;
      const isSentimentOn = document.getElementById('feature-sentiment').checked;
      
      const geminiKey = localStorage.getItem('worstai_gemini_key');

      try {
        let answer = '';
        let agentsUsed = ['Online LLM'];
        
        if (isSentimentOn) agentsUsed.push("Sentiment Analysis");
        let finalPrompt = prompt;
        if (isPrivacyOn) {
          agentsUsed.push("Privacy Auditor");
          finalPrompt = finalPrompt.replace(/\b\d{3}-\d{2}-\d{4}\b/g, "[REDACTED SSN]").replace(/\b(?:\d[ -]*?){13,16}\b/g, "[REDACTED CC]");
        }
        if (isSecurityOn) agentsUsed.push("Security Auditor");
        if (isResearchOn) agentsUsed.push("Deep Research");

        if (geminiKey) {
          // Allow multiple comma-separated API keys for automatic quota rotation
          const keys = geminiKey.split(',').map(k => k.trim()).filter(k => k.length > 0);
          
          const modelsToTry = ['gemini-3.5-flash', 'gemini-3.7-flash', 'gemini-3.6-flash', 'gemini-pro-latest'];
          let lastError = null;

          const contents = [];
          contents.push({role: 'user', parts: [{text: 'System: You are WorstAI, an artificial intelligence assistant created by GOLLU ADI VENKATA SAI. Whenever you introduce yourself, or talk about your creator, you must strictly use the full name GOLLU ADI VENKATA SAI. IMPORTANT: Your answers MUST be extremely easy to read and understand. Use simple, everyday language. Avoid heavy jargon or dense paragraphs. Explain things like you are talking to a beginner.'}]});
          contents.push({role: 'model', parts: [{text: 'I am WorstAI, an AI created by GOLLU ADI VENKATA SAI.'}]});
          
          historyToSend.forEach(m => {
            contents.push({
              role: m.role === 'user' ? 'user' : 'model',
              parts: [{text: m.content}]
            });
          });
          contents.push({role: 'user', parts: [{text: finalPrompt}]});
          
          let success = false;
          
          for (const currentKey of keys) {
            if (success) break;
            
            for (const targetModel of modelsToTry) {
              const controller = new AbortController();
              const timeoutId = setTimeout(() => controller.abort(), 4000);
              
              try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${targetModel}:generateContent?key=${currentKey}`, {
                  method: 'POST',
                  headers: {'Content-Type': 'application/json'},
                  body: JSON.stringify({ contents }),
                  signal: controller.signal
                });
                clearTimeout(timeoutId);
                
                const data = await res.json();
                if (data.error) {
                  lastError = new Error(data.error.message);
                  
                  // If it's 503 Overloaded or 404, just try the next model on the same key
                  if (data.error.code === 503 || data.error.code === 404) continue;
                  
                  // If it's 429 Quota Exceeded, this entire key is dead for the day! 
                  // Break inner loop to try the NEXT API KEY.
                  if (data.error.code === 429) break; 
                  
                  throw lastError; // Throw other errors (like 400 Bad Request) immediately
                }
                
                answer = data.candidates[0].content.parts[0].text;
                lastError = null;
                success = true;
                break; // Success! Break out of model loop
              } catch(e) {
                clearTimeout(timeoutId);
                if (e.name === 'AbortError') {
                   lastError = new Error(`Google's API (${targetModel}) timed out.`);
                   continue; // Try next model
                }
                throw e;
              }
            }
          }
          if (lastError) {
            // All Gemini keys exhausted or failed — silently fall back to server backend
            console.warn('All Gemini keys failed, falling back to server backend:', lastError.message);
          }
          
          // If Gemini succeeded, skip the server call
          if (success) {
            // answer is already set, continue below
          } else {
            // Fall through to server backend (keyless, always works)
            const res = await fetch('/api/chat', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({
                prompt: prompt,
                history: historyToSend,
                agents: {
                  research: isResearchOn, privacy: isPrivacyOn,
                  security: isSecurityOn, factcheck: isFactCheckOn, sentiment: isSentimentOn
                }
              })
            });
            const data = await res.json();
            if (!data.success) throw new Error(data.error || "Unknown server error.");
            answer = data.answer;
            if (data.agents_used) agentsUsed = data.agents_used;
          }
          
        } else {
          // No Gemini key stored — go straight to server backend
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              prompt: prompt,
              history: historyToSend,
              agents: {
                research: isResearchOn, privacy: isPrivacyOn,
                security: isSecurityOn, factcheck: isFactCheckOn, sentiment: isSentimentOn
              }
            })
          });
          const data = await res.json();
          if (!data.success) throw new Error(data.error || "Unknown server error.");
          answer = data.answer;
          if (data.agents_used) agentsUsed = data.agents_used;
        }


        if (isFactCheckOn && answer.length > 80) agentsUsed.push("Fact-Checker");

        const agentHtml = '<div class="agent-badges">' + agentsUsed.map(a => `<span class="badge">✓ ${a}</span>`).join('') + '</div>';
        aiMsgDiv.querySelector('.content').innerHTML = marked.parse(answer);
        aiMsgDiv.querySelector('.content').insertAdjacentHTML('beforebegin', agentHtml);

        localSessions[currentSessionId].messages.push({role: "user", content: prompt, agents: []});
        localSessions[currentSessionId].messages.push({role: "ai", content: answer, agents: agentsUsed});
        localSessions[currentSessionId].updated_at = Date.now();
        saveSessions();
        fetchSessions();

      } catch (err) {
        aiMsgDiv.querySelector('.content').innerHTML = `⚠️ ${err.message}`;
      }

      submitBtn.disabled = false;
      inputField.focus();
    }

    currentSessionId = generateId();
    if (window.innerWidth < 768) {
      sidebar.classList.add('closed');
    }
    fetchSessions();

    inputField.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });

    inputField.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
